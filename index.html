<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff3d5a">
<title>PTE 刷词</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">PTE<b>刷词</b></div>
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">推荐</button>
      <button class="chip" data-f="fav" aria-pressed="false">收藏</button>
      <button class="chip" data-f="todo" aria-pressed="false">没斩</button>
    </div>
    <button class="ico" id="openSearch" aria-label="搜索单词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  </header>
  <button class="today" id="today" aria-label="今日进度"></button>
  <main id="main">
    <section class="view" id="v-feed">
      <div class="loading" id="loading">正在加载词库…</div>
      <div class="feed" id="feed"></div>
      <div class="more" id="more"></div>
    </section>
    <section class="view rv" id="v-review" hidden></section>
    <section class="view me" id="v-me" hidden></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-v="feed" aria-current="page">刷</button>
    <button data-v="review">复习<span class="dot" id="dueDot" hidden></span></button>
    <button data-v="me">我</button>
  </nav>

  <div class="search" id="search" hidden>
    <div class="sbar">
      <button class="ico" id="closeSearch" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input id="q" type="search" placeholder="搜单词或中文释义" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="res" id="sres"></div>
  </div>
  <article class="post" id="post" hidden role="dialog" aria-modal="true"></article>
  <div class="toast" id="toast" role="status"></div>
  <div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
